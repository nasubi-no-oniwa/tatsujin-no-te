let AC=null,master=null,penG=null,NB=null;
function audio(){if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  const len=Math.floor(AC.sampleRate*1.5);NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);let sd=7;for(let i=0;i<len;i++){sd=(sd*16807)%2147483647;d[i]=sd/2147483647*2-1;}
  const src=AC.createBufferSource();src.buffer=NB;src.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=.6;penG=AC.createGain();penG.gain.value=0;src.connect(bp);bp.connect(penG);penG.connect(master);src.start();
 }catch(e){AC=null;}return AC;}
function pen(v){if(!AC||!penG)return;penG.gain.setTargetAtTime(cl(v,0,1)*.3,AC.currentTime,.03);}
function tone(f,dur,type,vol,f2,delay){if(!AC)return;const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(vol||.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.02);}
function noise(dur,vol,freq,type,delay){if(!AC||!NB)return;const t0=AC.currentTime+(delay||0),s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq||1800;const g=AC.createGain();g.gain.setValueAtTime(vol||.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t0,.3);s.stop(t0+dur+.02);}
const SFX={tick:()=>tone(1300,.035,'square',.07),whoosh:()=>noise(.3,.2,900,'bandpass'),stamp:()=>{tone(150,.28,'sine',.7,50);noise(.07,.35,2500);},

const F=(px,w)=>(w||900)+' '+Math.max(8,Math.round(px))+'px '+SERIF;
function lay(W,H){const m=W*.04,side=Math.min(W-2*m,H*.56);return {side,px:(W-side)/2,py:H*.16};}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function fitText(g,txt,x,y,maxW,px,col,w){let p=px;g.font=F(p,w);const tw=g.measureText(txt).width;if(tw>maxW){p=p*maxW/tw;g.font=F(p,w);}g.fillStyle=col;g.fillText(txt,x,y);}
function curve(g,P,close){if(P.length<2)return;g.beginPath();g.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length-1;i++){g.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2);}const l=P[P.length-1];g.lineTo(l[0],l[1]);if(close)g.closePath();}
function dense(P,dev,a,b){const o=[];for(let i=a;i<b-1;i++){const p0=P[Math.max(a,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(b-1,i+2)];for(let j=0;j<4;j++){const u=j/4,u2=u*u,u3=u2*u;
  o.push([.5*(2*p1[0]+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),.5*(2*p1[1]+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3),Math.abs(lerp(dev[i],dev[i+1],u))]);}}

const mixc=k=>'rgb('+Math.round(lerp(28,217,k))+','+Math.round(lerp(28,67,k))+','+Math.round(lerp(28,47,k))+')';
function drawStroke(g,V,X,Y,lw,ck){const D=strokesOf(V);g.lineWidth=lw;
 for(let si=0;si<D.length;si++){const d=D[si];const sh=D.length===1?V.show:(si===0?cl(V.show/.45,0,1):cl((V.show-.55)/.45,0,1));const n=Math.floor(sh*(d.length-1));if(sh<=0)continue;
  if(n<1){g.fillStyle=INK;g.beginPath();g.arc(X(d[0][0]/QM),Y(d[0][1]/QM),lw/2,0,TAU);g.fill();continue;}
  if(ck<=0){g.strokeStyle=INK;g.beginPath();g.moveTo(X(d[0][0]/QM),Y(d[0][1]/QM));for(let i=1;i<=n;i++)g.lineTo(X(d[i][0]/QM),Y(d[i][1]/QM));g.stroke();}
  else for(let i=0;i<n;i++){g.strokeStyle=mixc(cl((d[i][2]+d[i+1][2])/2/.04,0,1)*ck);g.beginPath();g.moveTo(X(d[i][0]/QM),Y(d[i][1]/QM));g.lineTo(X(d[i+1][0]/QM),Y(d[i+1][1]/QM));g.stroke();}}}
function penTip(V){const D=strokesOf(V);if(V.show>=1||V.show<=0)return null;let si=0,sh=V.show;if(D.length===2){if(V.show<.45)sh=V.show/.45;else if(V.show<.55)return null;else{si=1;sh=(V.show-.55)/.45;}}const d=D[si];const p=d[Math.floor(sh*(d.length-1))];return [p[0]/QM,p[1]/QM];}
function idealPath(g,r,X,Y,k){g.beginPath();
 if(r.ev==='maru'){g.arc(X(r.cx/QM),Y(r.cy/QM),r.r*k,0,TAU);}
 else if(r.ev==='batsu'){const co=Math.cos(r.ph),si=Math.sin(r.ph);g.moveTo(X((r.cx-r.R*co)/QM),Y((r.cy-r.R*si)/QM));g.lineTo(X((r.cx+r.R*co)/QM),Y((r.cy+r.R*si)/QM));g.moveTo(X((r.cx+r.R*si)/QM),Y((r.cy-r.R*co)/QM));g.lineTo(X((r.cx-r.R*si)/QM),Y((r.cy+r.R*co)/QM));}
 else{const v=S.polyVerts(r);g.moveTo(X(v[0][0]/QM),Y(v[0][1]/QM));for(let i=1;i<v.length;i++)g.lineTo(X(v[i][0]/QM),Y(v[i][1]/QM));g.closePath();}}
function markPath(g,ev,cx,cy,r){g.beginPath();
 if(ev==='maru')g.arc(cx,cy,r,0,TAU);
 else if(ev==='sankaku'){g.moveTo(cx,cy-r*1.1);g.lineTo(cx+r*1.1,cy+r*.8);g.lineTo(cx-r*1.1,cy+r*.8);g.closePath();}
 else if(ev==='shikaku')g.rect(cx-r*.9,cy-r*.9,r*1.8,r*1.8);
 else{g.moveTo(cx-r*.9,cy-r*.9);g.lineTo(cx+r*.9,cy+r*.9);g.moveTo(cx+r*.9,cy-r*.9);g.lineTo(cx-r*.9,cy+r*.9);}}

// 物になる：描いた形を、形の真ん中を中心にした大きさ1くらいの形にする
function shapeLocal(V){const r=V.res,P=V.pts;if(r._shp)return r._shp;let rot=0;
 if(r.ev==='sankaku'){const sec=TAU/3;let best=9;for(let k=0;k<3;k++){const d=wrap(r.ph+sec*k+Math.PI/2);if(Math.abs(d)<Math.abs(best))best=d;}rot=-best;}
 if(r.ev==='shikaku'){let d=wrap(r.ph-Math.PI/4);const q=Math.PI/2;d=d-Math.round(d/q)*q;rot=-d;}
 const co=Math.cos(rot),si=Math.sin(rot);r._shp=P.map(p=>{const x=(p[0]-r.cx)/r.req,y=(p[1]-r.cy)/r.req;return [x*co-y*si,x*si+y*co];});return r._shp;}
const mxY=(shp,a)=>{const s=Math.sin(a),c=Math.cos(a);let m=-9;for(const p of shp){const y=p[0]*s+p[1]*c;if(y>m)m=y;}return m;};
function objKin(V,t,s){const r=V.res,shp=shapeLocal(V),ev=r.ev;const o={};
 if(ev==='maru'){o.Rp=s*.16;const tt=Math.max(0,t-.25);o.a=4.2*tt;o.x=-.25*s+o.a*o.Rp;o.y=.8*s-mxY(shp,o.a)*o.Rp;}
 else if(ev==='sankaku'||ev==='shikaku'){o.Rp=s*.2;const TL=.75,tau=t-TL;const A=ev==='sankaku'?cl(.08+r.Eshape*5,.08,.55):0;
  o.a=ev==='sankaku'?(tau<0?A*.7:A*Math.exp(-2.2*tau)*Math.cos(8*tau)):0;const rest=.8*s-mxY(shp,o.a)*o.Rp;o.x=.5*s;
  o.y=tau<0?lerp(-.35*s,rest,(t/TL)*(t/TL)):rest;o.sy=tau<0?1:1-.16*Math.exp(-8*tau)*Math.cos(20*tau);o.sk=ev==='shikaku'&&tau>=0?.22*Math.exp(-3*tau)*Math.sin(13*tau):0;o.tau=tau;}
 else{o.Rp=s*.2;const T0=.25,TH=1.35,u=cl((t-T0)/(TH-T0),0,1);o.x=lerp(-.25*s,.72*s,u);o.y=.36*s-Math.sin(Math.PI*u)*.1*s;const tau=t-TH;o.a=t<TH?15*Math.max(0,t-T0):15*(TH-T0)+.12*Math.exp(-6*tau)*Math.sin(40*tau);o.tau=tau;}
 return o;}
function paintObj(g,px,py,s,V){const t=V.ot,r=V.res,ev=r.ev,shp=shapeLocal(V),o=objKin(V,t,s),gy=py+.8*s;
 g.save();g.globalAlpha=cl((t-.1)/.2,0,1);g.lineCap='round';g.lineJoin='round';
 // 地面
 g.strokeStyle=INK;g.lineWidth=s*.008;g.beginPath();g.moveTo(px+s*.04,gy);g.lineTo(px+s*.96,gy);g.stroke();
 const loc=()=>shp.map(p=>[p[0],p[1]]);
 if(ev==='maru'){g.strokeStyle='#0003';g.lineWidth=s*.006;for(let i=0;i<6;i++){g.beginPath();g.moveTo(px+s*(.08+i*.16),gy+s*.05);g.lineTo(px+s*(.16+i*.16),gy+s*.05);g.stroke();}
  g.translate(px+o.x,py+o.y);g.rotate(o.a);g.scale(o.Rp,o.Rp);curve(g,loc(),true);g.fillStyle='#2b2b2b';g.fill();
  g.save();g.scale(.62,.62);curve(g,loc(),true);g.fillStyle='#d9dcdf';g.fill();g.restore();
  g.strokeStyle='#8d949b';g.lineWidth=.08;for(let k=0;k<5;k++){const a=k*TAU/5;g.beginPath();g.moveTo(Math.cos(a)*.15,Math.sin(a)*.15);g.lineTo(Math.cos(a)*.56,Math.sin(a)*.56);g.stroke();}
  g.fillStyle='#8d949b';g.beginPath();g.arc(0,0,.17,0,TAU);g.fill();}
 else if(ev==='sankaku'||ev==='shikaku'){
  // 皿
  g.fillStyle='#e3ebf0';g.strokeStyle='#9fb0bd';g.lineWidth=s*.006;g.beginPath();g.ellipse(px+s*.5,gy+s*.012,s*.33,s*.035,0,0,TAU);g.fill();g.stroke();
  g.translate(px+o.x,gy);g.scale(1/Math.sqrt(o.sy),o.sy);g.transform(1,0,-o.sk,1,0,0);g.translate(0,py+o.y-gy);g.rotate(o.a);g.scale(o.Rp,o.Rp);
  if(ev==='sankaku'){curve(g,loc(),true);g.fillStyle='#fff';g.fill();g.save();g.clip();g.fillStyle='#1f2d1f';g.fillRect(-.5,.1,1,2);g.restore();curve(g,loc(),true);g.strokeStyle=INK;g.lineWidth=.07;g.stroke();
   g.fillStyle=INK;g.beginPath();g.arc(-.2,-.3,.055,0,TAU);g.arc(.2,-.3,.055,0,TAU);g.fill();g.lineWidth=.045;g.beginPath();g.arc(0,-.2,.1,.15*Math.PI,.85*Math.PI);g.stroke();}
  else{curve(g,loc(),true);g.fillStyle='#fffdf0';g.fill();
   if(o.tau>.45){const k=cl((o.tau-.45)/.25,0,1),k2=cl((o.tau-.6)/1,0,1);g.save();g.clip();g.fillStyle='#6b3a1a';g.globalAlpha*=k;g.fillRect(-.66,-2,1.32,2-.785+.15);g.lineCap='round';g.strokeStyle='#6b3a1a';g.lineWidth=.12;g.beginPath();g.moveTo(-.4,-.7);g.lineTo(-.4,-.7+.75*k2);g.moveTo(.3,-.7);g.lineTo(.3,-.7+.45*k2);g.stroke();g.restore();}
   curve(g,loc(),true);g.strokeStyle='#b3aa84';g.lineWidth=.06;g.stroke();
   if(o.tau>.45){const k=cl((o.tau-.45)/.2,0,1);g.fillStyle='#3fa34d';for(const x of [-.32,-.14,.04,.2,.36]){g.beginPath();g.arc(x,-.785-.05+(x*x)*.2,.055*k,0,TAU);g.fill();}}}}
 else{ // 手裏剣と柱
  g.fillStyle='#8a5a2b';g.fillRect(px+s*.8,py+s*.1,s*.1,s*.7);g.strokeStyle='#5e3c1a';g.lineWidth=s*.006;g.strokeRect(px+s*.8,py+s*.1,s*.1,s*.7);for(let i=0;i<4;i++){g.beginPath();g.moveTo(px+s*.82,py+s*(.2+i*.15));g.lineTo(px+s*.88,py+s*(.24+i*.15));g.stroke();}
  g.translate(px+o.x,py+o.y);g.rotate(o.a);g.scale(o.Rp,o.Rp);g.lineCap='butt';
  const h=S.N/2,A=shp.slice(0,h),B=shp.slice(h);for(const st of [A,B]){curve(g,st);g.strokeStyle='#3a4046';g.lineWidth=.34;g.stroke();}

  g.fillStyle=PAPER;g.strokeStyle='#3a4046';g.lineWidth=.05;g.beginPath();g.arc(0,0,.12,0,TAU);g.fill();g.stroke();}

  if(oa>0){
   g.globalAlpha=oa;drawStroke(g,V,X,Y,lw,V.jt>=1?sm((V.jt-1)/.5):0);

async function loadBoard(ev){const c=BC[ev];if(c&&Date.now()-c.t<60000)return c;
 const [j,pc,h]=await Promise.all([fetchR(DB('r/'+ev)+'.json?orderBy=%22k%22&endAt='+(S.FULL-1)+'&limitToLast='+TOPN).then(r=>{if(!r.ok)throw 0;return r.json();}),
  fetchR(DB('p/'+ev)+'.json?shallow=true').then(r=>r.ok?r.json():null).catch(()=>null),fetchR(DB('hidden')+'.json').then(r=>r.ok?r.json():null).catch(()=>null)]);
 const perf=pc?Object.keys(pc).filter(id=>!(h&&h[id])).length:0;
 // 線から点を計算しなおして、合わない記録は出さない
 const rows=Object.entries(j||{}).map(([id,v])=>({...v,id})).filter(r=>!(h&&h[r.id])&&r.s<S.FULL&&S.verify(ev,r.p,r.s)).sort((a,b)=>b.k-a.k||a.t-b.t);
 const base=perf>0?1:0;rows.forEach((r,i)=>{r.rk=i>0&&rows[i-1].k===r.k?rows[i-1].rk:i+1+base;});
 const thr=ls.get('tt_thr',{});thr[ev]={k:rows.length>=TOPN?rows[rows.length-1].k:0,t:Date.now()};ls.set('tt_thr',thr);
 return BC[ev]={t:Date.now(),rows,perf,hid:h};}
async function loadPerfect(ev,h){const j=await fetchR(DB('r/'+ev)+'.json?orderBy=%22k%22&equalTo='+S.FULL+'&limitToFirst=30').then(r=>{if(!r.ok)throw 0;return r.json();});
 return Object.entries(j||{}).map(([id,v])=>({...v,id})).filter(r=>!(h&&h[r.id])&&S.verify(ev,r.p,r.s)).sort((a,b)=>a.t-b.t);}
async function submit(){const msg=$('sendMsg'),bst=$('rBest');msg.textContent='';msg.className='note';const ev=ST.ev,res=ST.res,me=ST;
 const best=ls.get('tt_best',{}),prev=best[ev];const isBest=prev==null||res.s>prev;if(isBest){best[ev]=res.s;ls.set('tt_best',best);}
 bst.textContent=isBest&&prev!=null?t('newBest'):t('myBest',{p:S.pct(best[ev])});bst.className='note'+(isBest&&prev!=null?' ok':'');
 if(PV){msg.textContent=t('sentRank',{r:7});msg.className='note ok';return;}
 if(!isBest)return;msg.textContent=t('sending');
 try{const st=ticketP?await ticketP:null;if(st==null){msg.textContent=t('offline');msg.className='note err';return;}const a=await fbAuth();
  const w=900-(Date.now()-ticketAt);if(w>0)await sleep(w);
  const r=await PUT(DB('r/'+ev+'/'+a.uid)+QA(a),{n:myName().slice(0,16),p:me.p,s:res.s,k:res.s,d:me.d,st,v:1,t:TS});
  if(ST!==me)return;
  if(!r.ok){if(r.status===401||r.status===403){msg.textContent='';return;}throw new Error('put '+r.status);}
  if(res.s>=S.FULL){await PUT(DB('p/'+ev+'/'+a.uid)+QA(a),true).catch(()=>{});msg.textContent=t('sentRank',{r:1});msg.className='note ok';BC[ev]=null;return;}
  const thr=(ls.get('tt_thr',{})||{})[ev];
  if(thr&&Date.now()-thr.t<600000&&thr.k>0&&res.s<thr.k){msg.textContent=t('rankOut');return;}
  if(!thr&&res.s<95000){msg.textContent='';return;}
  BC[ev]=null;const b=await loadBoard(ev);if(ST!==me)return;const row=b.rows.find(x=>x.id===a.uid);
  if(row){msg.textContent=t('sentRank',{r:row.rk});msg.className='note ok';}else msg.textContent=t('rankOut');
 }catch(e){console.warn(e);msg.textContent=t('senderr');msg.className='note err';}}
let rankFrom=false,rkEv='maru',rkRows=[],rkPerf=[];
const PVROWS=[['コンパスおじさん',99412],['定規の妖精',98877],['ふつうの人',97203]];
async function openRank(ev,fromResult){if(fromResult!=null)rankFrom=!!fromResult;rkEv=ev||rkEv;show('rankPanel');$('replayBar').hidden=true;$('quitBtn').hidden=true;
 const bt=$('bTabs');bt.innerHTML='';for(const x of S.EVENTS){const e=document.createElement('button');e.innerHTML='<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">'+SVG[x]+'</svg>';if(x===rkEv)e.className='on';e.onclick=()=>openRank(x);bt.appendChild(e);}
 const box=$('rankBox');box.innerHTML='<p>'+esc(t('loading'))+'</p>';
 const rowH=(r,i,me)=>'<tr data-i="'+i+'"'+(me?' class="me"':'')+'><td class="r">'+r.rk+'</td><td class="n">'+esc(r.n)+'</td><td class="c">'+S.pct(r.s)+'%</td></tr>';
 const pfH=n=>'<tr class="pf" id="pfRow"><td class="r">1</td><td class="n">100% ▾</td><td class="c">'+esc(t('people',{n:n.toLocaleString()}))+'</td></tr>';
 const bind=()=>{box.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>{const i=+tr.dataset.i;startReplay(rkEv,i>=1000?rkPerf[i-1000]:rkRows[i]);});
  const pf=$('pfRow');if(pf)pf.onclick=async()=>{if(box.querySelector('tr.pl'))return;try{rkPerf=PV?[]:await loadPerfect(rkEv,(BC[rkEv]||{}).hid);const n=((BC[rkEv]||{}).perf||rkPerf.length)-rkPerf.length;
    pf.insertAdjacentHTML('afterend',rkPerf.map((r,i)=>'<tr class="pl" data-i="'+(1000+i)+'"><td></td><td class="n">'+esc(r.n)+'</td><td class="c">100.000%</td></tr>').join('')+(n>0?'<tr class="pl"><td></td><td colspan="2">'+esc(t('perfMore',{n}))+'</td></tr>':''));bind();}catch(e){}};};
 if(PV){rkRows=PVROWS.map((x,i)=>({rk:i+2,n:x[0],s:x[1]}));box.innerHTML='<table class="rank">'+pfH(3)+rkRows.map((r,i)=>rowH(r,-1,false)).join('')+'</table>';return;}
 const my=rkEv;try{const b=await loadBoard(rkEv);if(my!==rkEv)return;rkRows=b.rows;const myId=(ls.get('tt_auth',null)||{}).uid;
  let h='<table class="rank">'+(b.perf>0?pfH(b.perf):'')+rkRows.map((r,i)=>rowH(r,i,r.id===myId)).join('');if(!rkRows.length&&!b.perf)h+='<tr><td></td><td colspan="2">'+esc(t('empty'))+'</td></tr>';box.innerHTML=h+'</table>';bind();
 }catch(e){box.innerHTML='<p>'+esc(t('rankerr'))+'</p>';}}
let keepST=null;
function startReplay(ev,row){if(!row||!row.p)return;const pts=S.decode(row.p);const res=pts&&S.score(ev,pts);if(!res||res.err)return;audio();
 if(!keepST)keepST={ST,mode};ST={ev,pts,res,replay:true,name:row.n,phase:'rp',rt:0,rdur:cl((row.d||2000)/1000,.6,7),jt:0,ot:0};mode='play';show(null);$('replayBar').hidden=false;}
$('rpAgain').onclick=()=>{if(ST&&ST.replay){ST.phase='rp';ST.rt=0;ST.jt=0;}};
$('rpBack').onclick=()=>{pen(0);const k=keepST;keepST=null;ST=k?k.ST:null;mode=k?k.mode:'title';$('replayBar').hidden=true;show('rankPanel');};
$('rankBtn').onclick=()=>openRank('maru',false);
$('rankBack').onclick=()=>{if(rankFrom&&ST&&ST.res){mode='result';show('result');}else showTitle();};

// ===== OGP・アイコン・はじまり =====
function sample(ev,amp,seed){let sd=seed;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};const ph=[rnd()*6,rnd()*6,rnd()*6];const wob=u=>amp*(Math.sin(u*TAU+ph[0])+.6*Math.sin(2*u*TAU+ph[1])+.4*Math.sin(5*u*TAU+ph[2]));
 const M=160,mk=(f,T0,T1)=>{const o=[];for(let i=0;i<M;i++){const u=i/(M-1);const p=f(u);o.push({x:p[0],y:p[1],t:T0+(T1-T0)*u});}return o;};
 if(ev==='maru')return [mk(u=>{const a=u*TAU*1.01-1.4,r=.33*(1+wob(u));return [.5+r*Math.cos(a),.5+r*Math.sin(a)];},0,1900)];
 if(ev==='batsu')return [mk(u=>[.22+.56*u+wob(u)*.3,.22+.56*u-wob(u)*.3],0,700),mk(u=>[.79-.57*u+wob(u+.3)*.3,.21+.57*u+wob(u+.3)*.3],1100,1800)];
 const n=ev==='sankaku'?3:4,R=ev==='sankaku'?.4:.44,rot=ev==='sankaku'?-Math.PI/2:-Math.PI*3/4,cy=ev==='sankaku'?.56:.5;
 return [mk(u=>{const q=Math.min(n-1e-6,u*n*1.005),k=Math.floor(q),f=q-k,a0=rot+k*TAU/n,a1=rot+(k+1)*TAU/n;const x=.5+R*lerp(Math.cos(a0),Math.cos(a1),f),y=cy+R*lerp(Math.sin(a0),Math.sin(a1),f);const w=wob(u)*R*1.2;return [x+(x-.5)*w,y+(y-cy)*w];},0,2600)];}
function staticView(ev,amp,seed){const st=sample(ev,amp,seed),pts=S.pack(ev,st),res=S.score(ev,pts);return {ev,pts,res,show:1,jt:JLEN,ot:-1,timer:-1};}
if(OGP||ICON){mode='ogp';const W=cv.width,H=cv.height,g=G2;g.fillStyle=DESK;g.fillRect(0,0,W,H);g.textBaseline='middle';
 if(OGP){const V=staticView('maru',.012,5),ps=H*.8;paintPaper(g,W-ps-H*.1,H*.1,ps,V);g.textAlign='center';scoreStamp(g,W-ps/2-H*.1,H*.5,ps*.9,S.pct(V.res.s)+'%',1);
  g.textAlign='left';g.fillStyle=INK;g.font=F(H*.2);g.fillText(t('title'),W*.05,H*.26);g.font=F(H*.062,700);g.fillStyle=SUBC;g.fillText(t('sub'),W*.055,H*.42);
  g.strokeStyle=INK;g.lineWidth=H*.016;g.lineJoin='round';g.lineCap='round';S.EVENTS.forEach((e,i)=>{markPath(g,e,W*.09+i*H*.2,H*.63,H*.065);g.stroke();});
  g.fillStyle=RED;g.font=F(H*.068);g.fillText(t('ogp'),W*.05,H*.85);}
 else{const V=staticView('maru',.012,5);paintPaper(g,W*.08,H*.08,W*.84,V);g.textAlign='center';scoreStamp(g,W/2,H*.5,W*.62,S.pct(V.res.s)+'%',1);}
 window.__READY=true;}
else{applyLang();showTitle();if(!STEP)requestAnimationFrame(loop);
 if(!PV)fbAuth().catch(()=>{});}
window.__TT={S,sample,start:startEvent,bot(ev,strokes){startEvent(ev);ST.bot={strokes,t:0,i:0,si:0};},step:dt=>frame(dt),get st(){return ST;},get mode(){return mode;},openRank,showTitle,startReplay,setLang:k=>{lang=k;applyLang();},skip:skipToResult,makeVideo,paint,vidPlan,vidView,
 preview(tt){const pl=vidPlan();paint(G2,cv.width,cv.height,vidView(tt,pl));return pl;}};
