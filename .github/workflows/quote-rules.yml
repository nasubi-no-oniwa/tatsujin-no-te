# database.rules.xquote.json（Xの投稿で引用するツイートの一覧）を GitHub に上げると、自動で ft-red に反映する（ほかのゲームのルールはそのまま残す）
name: 引用ツイートの一覧のルールを反映
on:
  push:
    branches: [main]
    paths:
      - 'database.rules.xquote.json'
      - 'tools/deploy-quote.mjs'
      - '.github/workflows/quote-rules.yml'
  workflow_dispatch:
concurrency:
  group: ft-red-rules-xquote
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 道具を入れる
        run: mkdir -p "$RUNNER_TEMP/x" && cd "$RUNNER_TEMP/x" && npm init -y >/dev/null && npm i google-auth-library@9 --silent
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FT_RED_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FT_RED_SERVICE_ACCOUNT が登録されていません"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: ルールを反映
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node tools/deploy-quote.mjs
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
